services:
  # 1. PostgreSQL Database
  db:
    image: postgres:18-alpine
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-student_portfolio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-portfolio_admin} -d ${POSTGRES_DB:-student_portfolio}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - portfolio_net

  # 2. Node.js API Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: portfolio_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio_admin}:${POSTGRES_PASSWORD:-portfolio_secure_password}@db:5432/${POSTGRES_DB:-student_portfolio}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_random_32_char_production_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_to_another_random_32_char_secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BASE_URL: ${BASE_URL:-http://localhost}
    volumes:
      - uploads_data:/app/server/uploads
    networks:
      - portfolio_net

  # 3. Nginx Web Server & Reverse Proxy
  web:
    image: nginx:alpine
    container_name: portfolio_web
    restart: unless-stopped
    ports:
      - '${PORT_HTTP:-80}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - portfolio_net

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local

networks:
  portfolio_net:
    driver: bridge
